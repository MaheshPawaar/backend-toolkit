# Why this file exists: the only way to change what a visitor to backendkit
# receives is to change what gets built and deployed. The served site is static,
# so the dependency tree and the Actions that build it are the real attack
# surface — not the origin, which answers 405 to everything but GET.
#
# The point is notification speed. React2Shell (CVE-2025-55182) went from
# disclosure to mass exploitation in days; without this, a new advisory is only
# noticed the next time someone runs `npm audit` by hand.
version: 2
updates:
  # Actions are pinned to commit SHAs in .github/workflows/, which is what stops
  # a repointed tag from running attacker code in a job. Dependabot reads the
  # `# v4` comment after each SHA and bumps both together, so pinning does not
  # mean going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Security-only. Zero disables routine version updates for this ecosystem;
    # security updates are explicitly exempt from this limit and still open PRs.
    # The point was never to chase every patch bump — it was to hear about the
    # next React2Shell within hours rather than whenever someone next runs
    # `npm audit` by hand. Raise this to 5 to get routine bumps back.
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # One PR for the build toolchain rather than a dozen. Nothing here ships
      # to a browser — with `output: "export"` these run at build time only —
      # so they are reviewed together and merged on CI going green.
      build-toolchain:
        patterns: ["eslint*", "@eslint/*", "tailwindcss", "@tailwindcss/*", "postcss*", "sharp"]
        update-types: [minor, patch]
      # Everything else that is only a patch bump.
      minor-and-patch:
        patterns: ["*"]
        update-types: [patch]
    ignore:
      # Majors for next/react are a deliberate migration, not a weekly chore.
      # Security advisories still come through regardless of this rule.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # eslint 10 breaks against the eslint-config-next in use here:
      # `TypeError: scopeManager.addGlobals is not a function` at lint time.
      # Dependabot opened it as #21 and CI caught it. Ignoring the major stops it
      # returning every week as 10.9.2, 10.9.3 ... Drop this rule when
      # eslint-config-next supports eslint 10.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
